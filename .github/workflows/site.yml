name: SEO autopilot & deploy

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours vers 07:17 heure de Paris
  workflow_dispatch:
    inputs:
      skip_generation:
        description: "Déployer seulement (sans générer d'article)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.skip_generation)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 1. Récupérer les données Search Console
        run: python scripts/gsc_fetch.py
      - name: 2. Calculer la stratégie (nouveaux mots-clés + articles à améliorer)
        run: python scripts/strategy.py
      - name: 3. Écrire le(s) nouvel(s) article(s)
        run: python scripts/write_article.py
      - name: 4. Améliorer les articles sous-performants
        if: always()
        run: python scripts/refresh_article.py
      - name: 5. Vérifier que le site se construit
        if: always()
        run: python scripts/build.py
      - name: 6. Commit
        if: always()
        run: |
          git config user.name "seo-autopilot"
          git config user.email "seo-autopilot@users.noreply.github.com"
          git add content data
          git diff --cached --quiet && echo "Rien à publier" && exit 0
          git commit -m "SEO autopilot: $(date -u +%F)"
          git push

  deploy:
    needs: generate
    if: always() && needs.generate.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
